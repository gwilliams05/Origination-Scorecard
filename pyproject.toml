[project]
name = "origination-scorecard"
version = "0.1.0"
description = "Synthetic UK origination scorecard teaching project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "nbformat>=5.9,<6",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["data"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear: likely bugs and design problems
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # Pyflakes
    "I",   # isort-compatible import ordering
    "UP",  # pyupgrade: modern Python syntax
]
